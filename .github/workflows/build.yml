name: Build APK

# 触发：推 tag（如 v1.1）自动生成正式版 APK；也可在 Actions 里手动点 Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v3

      # 配了 KEYSTORE_BASE64 就还原出 keystore.jks 并自动签名；
      # 没配就出未签名包，不会失败
      - name: 还原签名密钥
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > keystore.properties <<'PROPS'
          keystore.file=keystore.jks
          store.password=${{ secrets.STORE_PASSWORD }}
          key.password=${{ secrets.KEY_PASSWORD }}
          key.alias=${{ secrets.KEY_ALIAS }}
          PROPS

      # ⚠️ 这一步必须有：gradlew 脚本没有执行权限时会报 127（命令不存在）
      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建正式版 APK
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 到构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xfan-mc-app-release
          path: app/build/outputs/apk/release/*.apk

      - name: 附带到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
